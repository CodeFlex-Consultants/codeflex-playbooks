id: common.jest
source: codeflex
overridePolicy: allowed
owner:
  team: web-platform
requiredReviewers:
  - web-platform
installWhen:
  any:
    - packageReference:
        package: "jest"
        version: ">=0.0.0"
    - packageReference:
        package: "@jest/globals"
        version: ">=0.0.0"
appliesWhen:
  paths:
    - "**/*.test.ts"
    - "**/*.test.tsx"
    - "**/*.test.js"
    - "**/*.test.jsx"
    - "**/*.spec.ts"
    - "**/*.spec.tsx"
    - "**/jest.config.*"
  capabilities:
    - testing
    - frontend
rules:
  - JEST-001
  - JEST-002
  - JEST-003
  - JEST-004
  - JEST-005
  - JEST-006
  - JEST-007
  - JEST-008
references:
  - references/test-structure-and-organization.md
  - references/mocking-and-stubbing.md
  - references/coverage-and-performance.md
review:
  lastReviewed: 2026-09-17
  reviewBy: 2027-03-01
